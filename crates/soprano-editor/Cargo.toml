[package]
name = "soprano-editor"
description = "Soprano's file surfaces in GPUI: rich Markdown and diff rows, the code editor, the diff tab and the Markdown reader."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
soprano-text = { path = "../soprano-text" }
soprano-git = { path = "../soprano-git" }
soprano-files = { path = "../soprano-files" }
soprano-keys = { path = "../soprano-keys" }
soprano-platform = { path = "../soprano-platform" }
soprano-ui = { path = "../soprano-ui" }
gpui.workspace = true
gpui-base = "=0.9.1"
async-channel = "2"
base64 = "0.22"
tracing.workspace = true
unicode-segmentation = "1"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui_platform.workspace = true
gpui-component.workspace = true
tempfile = "3"

