[package]
name = "soprano-chat-ui"
description = "Soprano's chat in GPUI: the timeline of turns (also the Agent Dashboard's transcript view) and the chat tab with its floating composer."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
soprano-agents = { path = "../soprano-agents" }
soprano-chat = { path = "../soprano-chat" }
soprano-editor = { path = "../soprano-editor" }
soprano-git = { path = "../soprano-git" }
soprano-keys = { path = "../soprano-keys" }
soprano-text = { path = "../soprano-text" }
soprano-types = { path = "../soprano-types" }
soprano-ui = { path = "../soprano-ui" }
gpui.workspace = true
gpui-component.workspace = true
serde_json.workspace = true
chrono = { version = "0.4.42", default-features = false, features = ["std", "clock"] }
futures = "0.3"
fancy-regex = "0.14"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui_platform.workspace = true

[[example]]
name = "chat_demo"
