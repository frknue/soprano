[package]
name = "soprano-browser"
description = "Soprano's browser pane: a wry web view with Herdr's toolbar and the `soprano browser` automation surface."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gpui.workspace = true
gpui-component.workspace = true
soprano-ui = { path = "../soprano-ui" }
gpui-webview = "=0.9.1"
wry = { package = "lb-wry", version = "0.53.3" }
serde_json.workspace = true
soprano-types = { path = "../soprano-types" }
async-channel = "2"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSDictionary", "NSError", "NSString", "NSData"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSImage", "NSImageRep", "NSBitmapImageRep"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "WKWebView", "WKSnapshotConfiguration"] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui_platform.workspace = true

[[example]]
name = "browser_demo"
path = "examples/browser_demo.rs"
