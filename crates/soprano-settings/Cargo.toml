[package]
name = "soprano-settings"
description = "The Settings card (General, Machines, Keyboard Shortcuts, Agent Profiles, Accounts, About) and the status bar's account usage popover, over settings.json."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
soprano-types = { path = "../soprano-types" }
soprano-platform = { path = "../soprano-platform" }
soprano-config = { path = "../soprano-config" }
soprano-launch = { path = "../soprano-launch" }
soprano-accounts = { path = "../soprano-accounts" }
soprano-ui = { path = "../soprano-ui" }
gpui.workspace = true
gpui-component.workspace = true
serde_json.workspace = true
async-channel = "2"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui_platform.workspace = true
tempfile = "3"

# The demo's `--snapshot` renders its window into PNGs; the renderer's support for that is
# switched on where it is known to build.
[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui_platform = { workspace = true, features = ["test-support"] }

[[example]]
name = "settings_demo"
