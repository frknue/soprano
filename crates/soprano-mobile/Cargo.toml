[package]
name = "soprano-mobile"
description = "Private mobile PWA server over Tailscale HTTPS with one-scan QR pairing."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
soprano-platform = { path = "../soprano-platform" }
soprano-types = { path = "../soprano-types" }
soprano-agents = { path = "../soprano-agents" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros", "time"] }
futures = "0.3"
async-channel = "2"
qrcode = { version = "0.14", default-features = false }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
