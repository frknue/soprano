[package]
name = "soprano-dashboard"
description = "The Agent Dashboard in GPUI: every agent across all windows, its conversation or live terminal, and a reply line."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
soprano-agents = { path = "../soprano-agents" }
soprano-model = { path = "../soprano-model" }
soprano-platform = { path = "../soprano-platform" }
soprano-text = { path = "../soprano-text" }
soprano-types = { path = "../soprano-types" }
soprano-ui = { path = "../soprano-ui" }
gpui.workspace = true
gpui-component.workspace = true
soprano-chat-ui = { path = "../soprano-chat-ui" }
soprano-editor = { path = "../soprano-editor" }
chrono = { version = "0.4.42", default-features = false, features = ["std", "clock"] }
futures = "0.3"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui_platform.workspace = true
# The demo's `--snapshot` mode.
soprano-ui = { path = "../soprano-ui", features = ["snapshot"] }
anyhow.workspace = true
serde_json.workspace = true
tempfile = "3"

# `--snapshot` renders the demo's window into PNGs; the renderer's support for that is switched
# on where it is known to build.
[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui_platform = { workspace = true, features = ["test-support"] }

[[example]]
name = "dashboard_demo"
