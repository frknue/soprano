# Soprano's private tmux server (`tmux -L soprano`) on a remote machine: it only keeps a
# pane's program running while the connection is down, so tmux itself stays out of the way.
# Sourced again on every attach, so every line must be safe to repeat.

# No prefix and no status line: every key reaches the program, the pane shows only it.
set -g prefix None
set -g prefix2 None
set -g status off
set -g escape-time 0
set -g focus-events on
set -g history-limit 50000
# Soprano selects and scrolls itself; no outer alternate screen, so scrolled-off lines land
# in Soprano's own scrollback.
set -g terminal-overrides ',*:smcup@:rmcup@,xterm-256color:Tc'
# The pane title and clipboard reach Soprano; OSC 7501 reports pass through DCS (tmux 3.3+).
set -g set-titles on
set -g set-titles-string '#T'
set -g set-clipboard on
set -gq allow-passthrough on
set -gq extended-keys on
set -gq window-size latest
# The session's command is a POSIX script, whatever the user's login shell is.
set -g default-shell /bin/sh
if-shell 'infocmp tmux-256color >/dev/null 2>&1' 'set -g default-terminal tmux-256color' 'set -g default-terminal screen-256color'
