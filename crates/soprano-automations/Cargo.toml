[package]
name = "soprano-automations"
description = "Runs the automations settings.json declares: schedules, prechecks, worktrees, run tracking and history."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
soprano-types = { path = "../soprano-types" }
soprano-platform = { path = "../soprano-platform" }
soprano-config = { path = "../soprano-config" }
soprano-model = { path = "../soprano-model" }
soprano-launch = { path = "../soprano-launch" }
soprano-agents = { path = "../soprano-agents" }
soprano-git = { path = "../soprano-git" }
soprano-ipc = { path = "../soprano-ipc" }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
chrono = "0.4.45"
chrono-tz = "0.10"
iana-time-zone = "0.1.65"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
