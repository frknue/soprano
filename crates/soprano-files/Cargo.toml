[package]
name = "soprano-files"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
soprano-git = { path = "../soprano-git" }
soprano-platform = { path = "../soprano-platform" }
notify = "8.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSFileManager", "NSURL", "NSError", "NSString"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
trash = "5"

[dev-dependencies]
tempfile = "3"
