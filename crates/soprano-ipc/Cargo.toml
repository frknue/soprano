[package]
name = "soprano-ipc"
description = "CLI subcommands (agent-event, navigate-pane, markdown, browser) and the local-socket transport to the running app."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
interprocess = "2.2"
serde.workspace = true
serde_json.workspace = true
soprano-types = { path = "../soprano-types" }
soprano-platform = { path = "../soprano-platform" }
unicode-segmentation = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
