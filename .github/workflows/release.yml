name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # crates/ghostty-sys builds libghostty-vt with exactly this Zig.
  ZIG_VERSION: 0.16.0
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Check out Soprano
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate tag, version, and changelog
        id: version
        run: |
          set -euo pipefail

          version="$(./scripts/cargo-version.sh)"

          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version." >&2
            exit 1
          fi
          if ! grep -Fq "## [$version] -" CHANGELOG.md; then
            echo "CHANGELOG.md has no release heading for $version." >&2
            exit 1
          fi

          echo "value=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build macOS ${{ matrix.architecture }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-15
          - architecture: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out Soprano and Ghostty
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      # Codeberg's archive endpoint hangs; fetch ghostty's Codeberg packages through git.
      - name: Prefetch Zig dependencies
        run: ./scripts/prefetch-zig-deps.sh

      - name: Build Soprano
        run: cargo build -p soprano --release --locked

      - name: Run tests
        if: matrix.architecture == 'arm64'
        run: cargo test --workspace --locked

      - name: Prepare build output
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail

          artifact_dir="$RUNNER_TEMP/soprano-$ARCHITECTURE"
          mkdir -p "$artifact_dir"
          cp "target/release/soprano" "$artifact_dir/Soprano-$ARCHITECTURE"

          actual_architecture="$(lipo -archs "$artifact_dir/Soprano-$ARCHITECTURE")"
          if [[ "$actual_architecture" != "$ARCHITECTURE" ]]; then
            echo "Expected $ARCHITECTURE, built $actual_architecture." >&2
            exit 1
          fi

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.architecture }}
          path: ${{ runner.temp }}/soprano-${{ matrix.architecture }}
          if-no-files-found: error
          retention-days: 1

  build-linux:
    name: Build Linux ${{ matrix.architecture }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu: the binary links the system glibc, so this sets
          # how old a distribution it runs on.
          - architecture: x86_64
            runner: ubuntu-22.04
          - architecture: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out Soprano and Ghostty
        uses: actions/checkout@v7
        with:
          # npm ci runs install scripts; no token reaches this job's later steps.
          persist-credentials: false
          submodules: true

      - name: Linux build dependencies
        timeout-minutes: 10
        run: |
          set -euo pipefail
          apt="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          sudo apt-get $apt update
          sudo apt-get $apt install -y --no-install-recommends \
            pkg-config clang libclang-dev \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev libfontconfig-dev libfreetype-dev \
            libdbus-1-dev libssl-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libxdo-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            ncurses-bin imagemagick

      - name: Install Node.js for the editable web app
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Prefetch Zig dependencies
        run: ./scripts/prefetch-zig-deps.sh

      - name: Build Soprano
        run: cargo build -p soprano --release --locked

      - name: Package the tarball
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          VERSION: ${{ needs.preflight.outputs.version }}
          SOPRANO_BUILD_PROFILE: release
          # The archive is relocatable: its desktop entry runs `soprano` from PATH.
          SOPRANO_DESKTOP_EXEC: soprano
        run: |
          set -euo pipefail

          name="soprano-$VERSION-linux-$ARCHITECTURE"
          package_root="$RUNNER_TEMP/package"
          mkdir -p "$package_root" dist
          ./scripts/package-linux.sh "$package_root/$name"

          test -x "$package_root/$name/bin/soprano"
          test -f "$package_root/$name/share/soprano/Soprano_Soprano.bundle/SopranoCopyMode.conf"
          test -f "$package_root/$name/share/soprano/terminfo/x/xterm-ghostty"
          test -f "$package_root/$name/share/applications/soprano.desktop"

          tar -czf "dist/$name.tar.gz" -C "$package_root" "$name"

      - name: Upload tarball
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.architecture }}
          path: dist/soprano-${{ needs.preflight.outputs.version }}-linux-${{ matrix.architecture }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  build-windows:
    name: Build Windows x64
    needs: preflight
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out Soprano and Ghostty
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true

      # bindgen's libclang: the runner image's LLVM.
      - name: Windows build dependencies
        run: echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"

      - name: Install Node.js for the editable web app
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Prefetch Zig dependencies
        run: ./scripts/prefetch-zig-deps.sh

      - name: Build Soprano
        run: cargo build -p soprano --release --locked

      - name: Package the zip
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Configuration release -OutputDir "$PWD\dist"

      - name: Upload zip
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: dist/soprano-${{ needs.preflight.outputs.version }}-windows-x64.zip
          if-no-files-found: error
          retention-days: 1

  release:
    name: Package and publish
    needs:
      - preflight
      - build
      - build-linux
      - build-windows
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Check out Soprano and Ghostty
        uses: actions/checkout@v7
        with:
          # npm ci runs install scripts; the token reaches only `gh` below.
          persist-credentials: false
          submodules: true

      - name: Install Node.js for the editable web app
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Packaging compiles Ghostty's terminfo source with Zig.
      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Download arm64 build
        uses: actions/download-artifact@v8
        with:
          name: build-arm64
          path: artifacts/arm64

      - name: Download x86_64 build
        uses: actions/download-artifact@v8
        with:
          name: build-x86_64
          path: artifacts/x86_64

      - name: Download Linux packages
        uses: actions/download-artifact@v8
        with:
          pattern: linux-*
          path: dist
          merge-multiple: true

      - name: Download Windows package
        uses: actions/download-artifact@v8
        with:
          name: windows-x64
          path: dist

      - name: Assemble universal release build
        run: |
          set -euo pipefail

          mkdir -p target/release
          lipo -create \
            artifacts/arm64/Soprano-arm64 \
            artifacts/x86_64/Soprano-x86_64 \
            -output target/release/soprano
          chmod 755 target/release/soprano

          architectures="$(lipo -archs target/release/soprano)"
          if [[ " $architectures " != *" arm64 "* || " $architectures " != *" x86_64 "* ]]; then
            echo "Universal build is incomplete: $architectures" >&2
            exit 1
          fi

      - name: Package the ad-hoc-signed app
        env:
          SOPRANO_CODESIGN_IDENTITY: "-"
        run: |
          set -euo pipefail
          mkdir -p dist
          ./scripts/package-app.sh \
            release \
            "$PWD/dist/Soprano.app" \
            "com.soprano.app" \
            "Soprano"
          test -f "$PWD/dist/Soprano.app/Contents/Resources/Soprano_Soprano.bundle/SopranoCopyMode.conf"
          test -f "$PWD/dist/Soprano.app/Contents/Resources/terminfo/78/xterm-ghostty"
          test ! -e "$PWD/dist/Soprano.app/Soprano_Soprano.bundle"

      - name: Create release disk image and cask
        env:
          SOPRANO_CODESIGN_IDENTITY: "-"
          SOPRANO_UNNOTARIZED_RELEASE: "1"
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail

          dmg_path="$PWD/dist/Soprano-$VERSION.dmg"
          ./scripts/create-release-dmg.sh "$PWD/dist/Soprano.app" "$dmg_path"

          sha256="$(shasum -a 256 "$dmg_path" | awk '{ print $1 }')"
          printf '%s  %s\n' "$sha256" "$(basename "$dmg_path")" \
            > "$dmg_path.sha256"
          ./scripts/generate-homebrew-cask.sh "$VERSION" "$sha256" \
            > "$PWD/dist/soprano.rb"
          ruby -c "$PWD/dist/soprano.rb"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "dist/Soprano-$VERSION.dmg" \
            "dist/Soprano-$VERSION.dmg.sha256" \
            "dist/soprano.rb" \
            "dist/soprano-$VERSION-linux-x86_64.tar.gz" \
            "dist/soprano-$VERSION-linux-aarch64.tar.gz" \
            "dist/soprano-$VERSION-windows-x64.zip" \
            --verify-tag \
            --title "Soprano $VERSION" \
            --notes "⚠️ This free release is ad-hoc signed and cannot be notarized without a paid Apple Developer membership. On first launch, macOS may require approval under System Settings → Privacy & Security → Open Anyway." \
            --generate-notes
