name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate release
    runs-on: macos-15
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Check out Soprano
        uses: actions/checkout@v7

      - name: Validate tag, version, and changelog
        id: version
        run: |
          set -euo pipefail

          short_version="$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleShortVersionString" \
              Support/Info.plist
          )"
          build_version="$(
            /usr/libexec/PlistBuddy \
              -c "Print :CFBundleVersion" \
              Support/Info.plist
          )"

          if [[ "$GITHUB_REF_NAME" != "v$short_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match Info.plist version $short_version." >&2
            exit 1
          fi
          if [[ "$build_version" != "$short_version" ]]; then
            echo "CFBundleVersion $build_version does not match $short_version." >&2
            exit 1
          fi
          if ! grep -Fq "## [$short_version] -" CHANGELOG.md; then
            echo "CHANGELOG.md has no release heading for $short_version." >&2
            exit 1
          fi

          echo "value=$short_version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.architecture }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-15
          - architecture: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out Soprano and Ghostty
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Homebrew Swift and compatible Zig
        run: |
          set -euo pipefail
          brew install swift zig@0.15
          echo "$(brew --prefix swift)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix zig@0.15)/bin" >> "$GITHUB_PATH"

      - name: Ensure the Metal toolchain is available
        run: |
          set -euo pipefail
          if ! xcrun --find metal >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          fi

      - name: Build libghostty
        run: |
          set -euo pipefail
          SOPRANO_DEVELOPER_DIR="$(xcode-select -p)" ./scripts/build-ghostty.sh

      - name: Build Soprano
        run: swift build -c release

      - name: Run tests
        if: matrix.architecture == 'arm64'
        run: swift test

      - name: Prepare build output
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail

          artifact_dir="$RUNNER_TEMP/soprano-$ARCHITECTURE"
          mkdir -p "$artifact_dir"
          cp ".build/release/Soprano" "$artifact_dir/Soprano-$ARCHITECTURE"

          actual_architecture="$(lipo -archs "$artifact_dir/Soprano-$ARCHITECTURE")"
          if [[ "$actual_architecture" != "$ARCHITECTURE" ]]; then
            echo "Expected $ARCHITECTURE, built $actual_architecture." >&2
            exit 1
          fi

          if [[ "$ARCHITECTURE" == "arm64" ]]; then
            tar -czf "$artifact_dir/release-resources.tar.gz" \
              .build/release/Soprano_Soprano.bundle \
              ghostty/zig-out/share/ghostty \
              ghostty/zig-out/share/terminfo
          fi

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.architecture }}
          path: ${{ runner.temp }}/soprano-${{ matrix.architecture }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: Package and publish
    needs:
      - preflight
      - build
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Check out Soprano
        uses: actions/checkout@v7

      - name: Download arm64 build
        uses: actions/download-artifact@v8
        with:
          name: build-arm64
          path: artifacts/arm64

      - name: Download x86_64 build
        uses: actions/download-artifact@v8
        with:
          name: build-x86_64
          path: artifacts/x86_64

      - name: Assemble universal release build
        run: |
          set -euo pipefail

          mkdir -p .build/release
          lipo -create \
            artifacts/arm64/Soprano-arm64 \
            artifacts/x86_64/Soprano-x86_64 \
            -output .build/release/Soprano
          chmod 755 .build/release/Soprano
          tar -xzf artifacts/arm64/release-resources.tar.gz

          architectures="$(lipo -archs .build/release/Soprano)"
          if [[ " $architectures " != *" arm64 "* || " $architectures " != *" x86_64 "* ]]; then
            echo "Universal build is incomplete: $architectures" >&2
            exit 1
          fi

      - name: Package the ad-hoc-signed app
        env:
          SOPRANO_CODESIGN_IDENTITY: "-"
          SOPRANO_GHOSTTY_RESOURCES_DIR: ${{ github.workspace }}/ghostty/zig-out/share/ghostty
          SOPRANO_STRICT_GHOSTTY_RESOURCES: "1"
        run: |
          set -euo pipefail
          mkdir -p dist
          ./scripts/package-app.sh \
            release \
            "$PWD/dist/Soprano.app" \
            "com.soprano.app" \
            "Soprano"

      - name: Create release disk image and cask
        env:
          SOPRANO_CODESIGN_IDENTITY: "-"
          SOPRANO_UNNOTARIZED_RELEASE: "1"
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail

          dmg_path="$PWD/dist/Soprano-$VERSION.dmg"
          ./scripts/create-release-dmg.sh "$PWD/dist/Soprano.app" "$dmg_path"

          sha256="$(shasum -a 256 "$dmg_path" | awk '{ print $1 }')"
          printf '%s  %s\n' "$sha256" "$(basename "$dmg_path")" \
            > "$dmg_path.sha256"
          ./scripts/generate-homebrew-cask.sh "$VERSION" "$sha256" \
            > "$PWD/dist/soprano.rb"
          ruby -c "$PWD/dist/soprano.rb"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "dist/Soprano-$VERSION.dmg" \
            "dist/Soprano-$VERSION.dmg.sha256" \
            "dist/soprano.rb" \
            --verify-tag \
            --title "Soprano $VERSION" \
            --notes "⚠️ This free release is ad-hoc signed and cannot be notarized without a paid Apple Developer membership. On first launch, macOS may require approval under System Settings → Privacy & Security → Open Anyway." \
            --generate-notes
